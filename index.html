<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17151d">
  <title>IAHN — Tamagotchi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="console-shell"><div class="console-screen">
  <div id="startScreen" class="start-screen" aria-label="Pantalla de inicio">
    <img class="start-title" src="assets/start/title.png" alt="IAHN Tamagotchi">
    <button id="startButton" class="start-button" type="button" aria-label="Start">
      <img src="assets/start/button.png" alt="START">
    </button>
  </div>
  <div id="usernameScreen" class="username-screen hidden" aria-hidden="true">
    <div class="username-box">
      <div class="username-kicker">PRIMERA VEZ</div>
      <h2>¿QUIÉN ERES?</h2>
      <p>Elige el nombre que aparecerá en IAHN.</p>
      <form id="usernameForm">
        <input id="usernameInput" name="username" type="text" maxlength="20" minlength="2" autocomplete="nickname" placeholder="Tu nombre..." required>
        <div id="firebaseStatus" class="firebase-status">🔴 Firebase no conectado</div>
        <button class="primary username-submit" type="submit">ENTRAR</button>
      </form>
    </div>
  </div>
  <main id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">TAMAGOTCHI</div>
      <h1>IAHN</h1>
    </div>
    <div class="top-controls"><button id="musicToggle" class="music-toggle" type="button" title="Mutear música de fondo" aria-label="Mutear música de fondo"><img src="assets/audio/music-note.png" alt=""><span id="musicToggleIcon">🎵</span><small id="musicToggleLabel">ON</small></button><div class="coins">⭐ <span id="points">0</span></div></div>
  </header>

  <section class="game-card">
    <div class="room">
      <div id="roomItems" class="room-items" aria-label="Decoración de la habitación"></div>
      <div class="cat-companion" id="catCompanion" aria-label="Gato">
        <img id="catSprite" src="assets/cat/cat_12.png" alt="Gato">
      </div>
      <div class="sprite-wrap">
        <div id="spriteBubble" class="tiny-heart">♡</div>
        <img id="iahn" class="iahn" src="assets/faces/01_normal.png" alt="Iahn">
        <div class="shadow"></div>
      </div>
      <div id="speech" class="speech">¿Qué hacemos hoy?</div>
      <div id="effect" class="effect"></div>
    </div>

    <section class="stats" aria-label="Estado de Iahn">
      <div class="stat mood"><div class="stat-head"><span class="stat-name"><b class="stat-symbol">♥</b> ÁNIMO</span><strong id="moodValue">78%</strong></div><div class="bar"><i id="moodBar"></i><span></span></div></div>
      <div class="stat hunger"><div class="stat-head"><span class="stat-name"><b class="stat-symbol">🍕</b> HAMBRE</span><strong id="hungerValue">62%</strong></div><div class="bar"><i id="hungerBar"></i><span></span></div></div>
      <div class="stat energy"><div class="stat-head"><span class="stat-name"><b class="stat-symbol">ϟ</b> ENERGÍA</span><strong id="energyValue">85%</strong></div><div class="bar"><i id="energyBar"></i><span></span></div></div>
      <div class="stat health"><div class="stat-head"><span class="stat-name"><b class="stat-symbol">♨</b> SALUD</span><strong id="healthValue">90%</strong></div><div class="bar"><i id="healthBar"></i><span></span></div></div>
    </section>

    <div class="main-actions" aria-label="Acciones principales">
      <button class="action food" data-open="food" title="Comer" aria-label="Comer"><img src="assets/button-icons/comer.png" alt=""></button>
      <button class="action meme" data-open="meme" title="Meme" aria-label="Meme"><img src="assets/button-icons/meme.png" alt=""></button>
      <button class="action care" data-open="care" title="Cariño" aria-label="Cariño"><img src="assets/button-icons/carino.png" alt=""></button>
      <button class="action play" data-open="play" title="Jugar" aria-label="Jugar"><img src="assets/button-icons/jugar.png" alt=""></button>
    </div>
  </section>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button class="active" data-open="home" title="Inicio" aria-label="Inicio"><img src="assets/button-icons/inicio.png" alt=""></button>
    <button data-open="chat" title="Chat" aria-label="Chat"><img src="assets/button-icons/chat.png" alt=""></button>
    <button data-open="gallery" title="Galería" aria-label="Galería"><img src="assets/button-icons/galeria.png" alt=""></button>
    <button data-open="shop" title="Tienda" aria-label="Tienda"><img src="assets/button-icons/tienda.png" alt="Tienda" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" /><span class="nav-emoji" style="display:none">🛍️</span></button>
    <button data-open="achievements" title="Logros" aria-label="Logros"><img src="assets/button-icons/logros.png" alt=""></button>
    <button data-open="friends" title="Amigos" aria-label="Amigos"><img src="assets/button-icons/amigos.png" alt=""></button>
  </nav>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">Menú</h2>
        <button id="closeModal" class="close" type="button">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <input id="photoInput" type="file" accept="image/*" hidden>
  <div id="toast" class="toast" aria-live="polite"></div>
</main></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
